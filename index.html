.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,61,76,.88) 0%,rgba(0,61,76,.55) 45%,rgba(0,61,76,.15) 100%)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.hero .wrap{position:relative;z-index:1;width:100%;padding-block:22px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .big{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:26px;letter-spacing:-0.02em;line-height:1.05;text-wrap:balance}
.hero .big span{display:block;font-size:13px;letter-spacing:.08em;opacity:.9;font-weight:400;margin-top:4px}
.hero .yb{background:var(--yellow);color:#1E2A30;font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px}
.heli .hdr{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:10px}
.heli .hdr img{width:84px;height:68px;object-fit:cover;border:1px solid var(--line);display:block}
.heli .hdr .lim{font-size:12px;color:var(--muted);margin-top:2px}
.strip .r .n small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.moon{font-size:11px;color:var(--muted)}
.acsel{display:inline-flex;border:2px solid var(--h2);border-radius:4px;overflow:hidden}.acsel button{background:transparent;color:var(--h2);border:0;padding:6px 12px;font-weight:700;cursor:pointer}.acsel button.on{background:var(--h2);color:#fff}
td.pl{color:var(--muted)} td.pg{font-weight:700;background:var(--ok-bg);color:var(--ok-fg)} td.pr{font-weight:700;background:var(--bad-bg);color:var(--bad-fg)}
.animwrap{border:1px solid var(--line);max-width:100%}
.animwrap svg{display:block;height:auto}
input[type=range]{accent-color:var(--teal)}
.heli.soon{border-style:dashed}
.heli.soon h3{color:var(--muted)}
main .wrap{padding-block:22px 40px;display:grid;gap:20px}
h2{font-family:var(--display);text-transform:uppercase;letter-spacing:-0.02em;font-size:18px;margin:0 0 4px;color:var(--h2);text-wrap:balance}
h2::after{content:"";display:block;width:36px;height:3px;background:var(--yellow);margin-top:6px}
h3{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px}
.panel{background:var(--panel);border:1px solid var(--line);padding:18px 18px 20px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>div,.charts>div,.notes>div{min-width:0}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
label{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:block;margin-bottom:4px}
textarea,input[type=number],select{width:100%;font-family:var(--body);font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:0}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:150px;resize:vertical;white-space:pre}
input[type=file]{font-size:13px;color:var(--fg)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>div{min-width:0;flex:1 1 180px}
button{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:14px;background:var(--teal);color:#fff;border:0;padding:12px 22px;cursor:pointer}
button:hover{background:var(--teal-deep)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
button.secondary{background:transparent;color:var(--h2);border:2px solid var(--h2)}
.radio{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.radio label{display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);font-size:14px;margin:0}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}
.status.err{color:var(--red)}
.kv{display:flex;gap:18px 28px;flex-wrap:wrap;font-size:14px}
.kv b{font-family:var(--display);font-weight:700;display:block;font-size:17px}
.kv span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.scen{grid-template-columns:1fr}}
.card{border:1px solid var(--line);padding:14px;position:relative;min-width:0;cursor:pointer;background:var(--panel)}
.card.sel{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.card .tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card .hd{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;margin:4px 0 2px}
.card .nm{font-weight:600;font-size:14px}
.card.isbest .tag{padding-right:112px}
.card .best{position:absolute;top:0;right:0;background:var(--yellow);color:#1E2A30;font-family:var(--display);font-size:11px;font-weight:700;padding:3px 8px;text-transform:uppercase}
.card .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.card .stats{grid-template-columns:repeat(2,1fr)}}
.card .stats div{font-size:12px;color:var(--muted)}
.card .stats b{display:block;font-size:15px;color:var(--fg);font-family:var(--display)}
.pill{display:inline-block;padding:1px 8px;font-size:12px;font-weight:600}
.ok{background:var(--ok-bg);color:var(--ok-fg)} .warn{background:var(--warn-bg);color:var(--warn-fg)} .bad{background:var(--bad-bg);color:var(--bad-fg)}
/* helideck strip */
.heli{border:1px solid var(--line);padding:14px;margin-bottom:16px;background:var(--panel)}
.strip{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.strip .r{display:grid;grid-template-columns:175px 1fr;gap:8px;align-items:center}
.strip .r .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .cells{display:grid;gap:2px}
.strip .c{height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#1E2A30;min-width:0;overflow:hidden}
.strip .c.night{opacity:.6}
.strip .days{display:grid;gap:2px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.strip .days div{border-left:1px solid var(--line);padding-left:3px;white-space:nowrap;overflow:hidden}
.heli .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.heli .leg i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px}
@media (max-width:600px){.strip .r{grid-template-columns:90px 1fr}}
.tblwrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;min-width:1000px}
th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-family:var(--display);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--panel)}
th.grp{text-align:center;border-bottom:1px solid var(--line);color:var(--h2)}
td:first-child,th:first-child,td.l,th.l{text-align:left}
tr.day td{background:var(--line-soft);font-weight:600;text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.v{font-weight:600}
svg text{font-family:var(--body);fill:var(--fg)}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:18px 24px;align-items:start}
.charts .ts{grid-column:1 / -1}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.notes{grid-template-columns:1fr}}
.notes ul,.notes ol{margin:6px 0 0 18px;padding:0}
.notes li{margin-bottom:5px}
.small{font-size:13px;color:var(--muted)}
.valtbl{min-width:0;font-size:13px}
.valtbl th,.valtbl td{white-space:normal}
footer .wrap{padding-block:16px;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer b{font-family:var(--display);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}
</style>
</head>

      pitch: { sigma: pitchS, sig: 2 * pitchS, max: pitchS * mpmFactor(r.pitch.Tz),   Tz: r.pitch.Tz },

  const MONTHS = { January:0,February:1,March:2,April:3,May:4,June:5,July:6,August:7,September:8,October:9,November:10,December:11 };
  const ROW = /^(\d{4})\s+([A-Z]{1,4})\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+([\d.]+)\s+([A-Z]{1,3})\s+([\d.]+)\s+(\d+)\s+([A-Z]{1,3})\s+([\d.]+)\s+(\d+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+(\d+)%\s+(\d+)%/;
  const VALID = /Valid\s+\w+,\s+(\w+)\s+(\d+),\s+(\d{4})/;
  const ISSUED = /Issued:\s*\w+,\s*(\w+)\s+(\d+),\s+(\d{4})\s+at\s+(\d{1,2}):(\d{2})\s*(AM|PM)/;
  const POS = /Position:\s*([\d.]+)\s*([NS])\s*([\d.]+)\s*([EW])/;
  function parseForecast(text) {
    const lines = text.replace(/\r/g, '').split('\n').map(l => l.trim());
    const out = { rows: [], issued: null, position: null, warnings: [] };
    const im = ISSUED.exec(text);
    if (im) { let h = +im[4] % 12 + (im[6] === 'PM' ? 12 : 0); out.issued = new Date(+im[3], MONTHS[im[1]], +im[2], h, +im[5]); }
    const pm = POS.exec(text);
    if (pm) out.position = { lat: +pm[1] * (pm[2] === 'S' ? -1 : 1), lon: +pm[3] * (pm[4] === 'W' ? -1 : 1), text: pm[1] + ' ' + pm[2] + ' ' + pm[3] + ' ' + pm[4] };
    let day = null;
    for (const l of lines) {
      const v = VALID.exec(l); if (v) { day = new Date(+v[3], MONTHS[v[1]], +v[2]); continue; }
      const m = ROW.exec(l);
      if (m && day) {
        const t = new Date(day.getTime()); t.setHours(+m[1].slice(0, 2), +m[1].slice(2));
        out.rows.push({ valid: t, wind10_dir: m[2], wind10_dir_deg: dir2deg(m[2]), wind10_kt: +m[3], gust10_kt: +m[4], wind50_kt: +m[5], gust50_kt: +m[6],
          windsea_hs: +m[7], swell1_dir: m[8], swell1_dir_deg: dir2deg(m[8]), swell1_hs: +m[9], swell1_tp: +m[10],
          swell2_dir: m[11], swell2_dir_deg: dir2deg(m[11]), swell2_hs: +m[12], swell2_tp: +m[13], hs_total: +m[14], hmax: +m[15] });
      }
    }
    if (!out.rows.length) out.warnings.push('No forecast rows recognised. Paste the text of the "Daily Planner" table (TIME / WIND / SWELL columns) or upload the DTN PDF / .eml.');
    return out;
  }
  return { CONDITIONS, SHIP, CAL, makeShip, naturalPeriods, rao, respond, respondRaw, partitionsFromRow, parseForecast, dir2deg, COMPASS, windseaTp, dnvGamma, isNightAt };
})();

    modelTitle:'Modelo',
    modelText:'Heave e pitch usam as expressões fechadas de Jensen, Mansour & Pedersen (2004, <i>Ocean Engineering</i> 31) para um casco tipo caixa com o mesmo comprimento, boca e calado, corrigidas pelos coeficientes de bloco e de linha d\'água, com razão efetiva de massa adicional seccional de 0,8. O roll é uma resposta linear de um grau de liberdade com excitação por declividade efetiva da onda, raio de giração da distribuição de pesos da estabilidade e razão de amortecimento linear equivalente de 0,22 ajustada ao registro do MRU. Cada linha da previsão vira três partições de mar (mar de vento, swell primário e secundário) com espectros JONSWAP (fator de pico da DNV-RP-C205) e espalhamento direcional cos²; as estatísticas vêm do espectro de resposta (significativo = 2σ, máximo mais provável = σ√(2 ln N)).',

    heliMethodTitle:'Probabilidade do heliponto (preliminar)',
    heliMethod:'Para cada passo de 6 h calculam-se, a partir dos espectros de resposta, os máximos mais prováveis em 20 min de caturro, balanço (mais o trim estático de 0,57° e a banda de 0,3° lidos pelo HMS; balanço no heliponto ajustado aos registros do HMS) e a velocidade de arfagem VArf da NORMAM-27 (maior oscilação vertical do centro do helideque dividida por meio período). A probabilidade de cada um ficar dentro do limite segue a distribuição de Rayleigh dos máximos, P = exp(−N·exp(−L²/2σ²)), integrada sobre a incerteza do próprio modelo (log-normal, da validação com o MRU). "Verde" é a probabilidade conjunta para caturro, balanço, inclinação e VArf, com os limites de dia ou de noite que valem naquela hora.',

    valHead:['Movimento','Correlação','Dentro de ±30 %','Dentro de ±50 %','Viés, 25 % maiores eventos','Patamar'],

    valCaveat:'<b>Leia a tabela com estas ressalvas.</b> As estatísticas são in-sample. Os fatores de escala (0,99 heave, 1,19 pitch, 0,88 roll) foram fixados para acertar os 25 % maiores eventos; no conjunto o modelo fica cerca de 14 % acima em heave e pitch e 37 % acima em roll com mar calmo, e dentro de 3 % nos 10 % maiores eventos (roll 18 % abaixo). Testes de hold-out: calibrado em setembro e testado no outubro mais calmo, correlação de heave 0,79 (57 % dentro de ±30 %, superestimativa em mar calmo), pitch 0,77 (89 %); calibrado em outubro e testado em setembro, heave 0,85 (79 %), pitch 0,82 (59 %); <b>roll 0,16 e 0,49, ou seja, pouca habilidade fora da amostra</b>. Trate o roll como indicativo. <b>Teste cego:</b> 365 passos de previsão que o modelo nunca viu (11–28 ago 2026, Hs 1,6–4,0 m, swell de todos os bordos) deram heave 83 % e pitch 77 % dentro de ±30 % (90 % para ambos em mar grosso), roll 58 %. O pitch é levemente superestimado com swell pelo través (cerca de 0,05°). Envelope validado: Hs 1,1–4,0 m, heave até 4,5 m máximo pico a pico (2,4 m significativo), todas as direções de swell. Vento previsto vs anemômetro da sonda: correlação 0,85, razão 1,06, o que sustenta a previsão como entrada.',

    stSteps:(n,m)=>`${n} passos de previsão${m>0?' ('+m+' linha(s) não reconhecida(s) — confira o texto)':''}`, stIssued:'emitida',

  const t=k=>I18N[LANG][k];

  function setStatus(el,msg,err){ el.textContent=msg; el.classList.toggle('err',!!err); }
  function fmtDate(d){ return d.toLocaleDateString(t('locale'),{weekday:'short',day:'2-digit',month:'short'}); }

  function fmtDT(d){ return fmtDate(d)+' '+fmtTime(d); }

  function deg(v){ return Math.round(((v%360)+360)%360); }
  function pad3(h){ return String(h).padStart(3,'0'); }

  // ---- file handling ----
  async function pdfToText(data){
    const doc=await pdfjsLib.getDocument({data}).promise; let out='';
    for(let p=1;p<=doc.numPages;p++){
      const page=await doc.getPage(p); const tc=await page.getTextContent();
      const lines=new Map();
      for(const it of tc.items){ if(!it.str) continue; const y=Math.round(it.transform[5]); if(!lines.has(y)) lines.set(y,[]); lines.get(y).push({x:it.transform[4],s:it.str}); }
      const ys=[...lines.keys()].sort((a,b)=>b-a);
      for(const y of ys){ out+=lines.get(y).sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ')+'\n'; }
    }
    return out;
  }
  function emlToPdf(text){
    const idx=text.search(/Content-Type:\s*application\/pdf/i); if(idx<0) return null;
    const after=text.slice(idx); const bstart=after.search(/\r?\n\r?\n/); if(bstart<0) return null;
    let body=after.slice(bstart).trim(); const end=body.search(/\r?\n--/); if(end>0) body=body.slice(0,end);
    const b64=body.replace(/[^A-Za-z0-9+/=]/g,''); const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u;
  }
  $('file').addEventListener('change', async ev=>{
    const f=ev.target.files[0]; if(!f) return;
    setStatus($('fileStatus'),t('stReading')(f.name));
    try{
      let data;
      if(/\.eml$/i.test(f.name)||f.type==='message/rfc822'){ const tx=await f.text(); data=emlToPdf(tx); if(!data) throw new Error(t('stNoPdf')); }
      else data=new Uint8Array(await f.arrayBuffer());
      if(!window.pdfjsLib) throw new Error(t('stNoReader'));
      const txt=await pdfToText(data); $('txt').value=txt;
      const fc=PBS.parseForecast(txt);
      setStatus($('fileStatus'), fc.rows.length? t('stRead')(fc.rows.length,f.name) : t('stNoTable'), !fc.rows.length);
      if(fc.rows.length) run();
    }catch(e){ setStatus($('fileStatus'),t('stErr')(e.message),true); }
  });

  $('run').addEventListener('click',run);
  document.querySelectorAll('input[name=hmode]').forEach(r=>r.addEventListener('change',()=>{ $('hdg').disabled=document.querySelector('input[name=hmode]:checked').value!=='fixed'; }));
  $('hdg').disabled=true;

  // ---- computation ----
  function worstIndex(res){ return Math.max(res.rt.sig/REF.heave,res.pitch.sig/REF.pitch,res.roll.sig/REF.roll); }
  function scenarioFor(ship,heading,rows){
    const lat=FC.position?FC.position.lat:-22.59, lon=FC.position?FC.position.lon:-40.23;
    const steps=rows.map(r=>{ const night=PBS.isNightAt(r.valid,lat,lon,-r.valid.getTimezoneOffset()/60); return {row:r,night,res:PBS.respond(ship,heading,PBS.partitionsFromRow(r),3,HELI_NIGHT_LIMITS&&night)}; });
    let worst=0, meanIdx=0, heliMin={AW139:1,S92:1}; steps.forEach((s,i)=>{ const ix=worstIndex(s.res); s.idx=ix; meanIdx+=ix; if(ix>steps[worst].idx) worst=i; if(!s.night) for(const k in heliMin) heliMin[k]=Math.min(heliMin[k],s.res.heli.aircraft[k].Pgreen); });
    return {heading,steps,worst,maxIdx:steps[worst].idx,meanIdx:meanIdx/steps.length,heliMin};
  }
  function dominantSwell(r){ return (r.swell2_hs>r.swell1_hs)?{d:r.swell2_dir_deg,hs:r.swell2_hs,tp:r.swell2_tp,n:r.swell2_dir}:{d:r.swell1_dir_deg,hs:r.swell1_hs,tp:r.swell1_tp,n:r.swell1_dir}; }
  function meanDir(angs,wts){ let x=0,y=0; angs.forEach((a,i)=>{ if(a==null) return; const w=wts?wts[i]:1; x+=w*Math.cos(a*Math.PI/180); y+=w*Math.sin(a*Math.PI/180); }); return deg(Math.atan2(y,x)*180/Math.PI); }
  function run(){
    setStatus($('runStatus'),t('stCalc')); $('run').disabled=true;
    setTimeout(()=>{ try{ runNow(); } catch(e){ setStatus($('runStatus'),t('stFail')+' '+e.message,true); } finally{ $('run').disabled=false; } },30);
  }
  function runNow(){
    const txt=$('txt').value; FC=PBS.parseForecast(txt);
    if(!FC.rows.length){ setStatus($('runStatus'),t('noRows'),true); $('summary').hidden=true; $('detail').hidden=true; return; }
    const ship=PBS.makeShip($('cond').value);
    const mode=document.querySelector('input[name=hmode]:checked').value;
    const rows=FC.rows; const first=rows.slice(0,Math.min(8,rows.length));
    const sweep=[]; for(let h=0;h<360;h+=5) sweep.push(scenarioFor(ship,h,rows));
    // model is symmetric head/following at zero speed, so h and h+180 tie; prefer the bow-to-weather side (DP practice)
    const swDir=meanDir(first.map(r=>dominantSwell(r).d),first.map(r=>dominantSwell(r).hs));
    sweep.forEach(s=>{ s.weather=180-Math.abs(((swDir-s.heading+180)%360+360)%360-180); });
    const minIdx=Math.min(...sweep.map(s=>s.maxIdx));
    const near=sweep.filter(s=>s.maxIdx<=minIdx+0.02);
    let best=near[0]; for(const s of near){ if(s.weather>best.weather+1e-9||(Math.abs(s.weather-best.weather)<1e-9&&s.meanIdx<best.meanIdx)) best=s; }
    const scen=[];
    if(mode==='fixed'){ const h=deg(+$('hdg').value||0); scen.push(Object.assign(scenarioFor(ship,h,rows),{nameKey:'planned',noteKey:'plannedNote'})); scen.push(Object.assign(best,{nameKey:'best',noteKey:'bestNote',isBest:true})); }
    else{
      scen.push(Object.assign(best,{nameKey:'best',noteKey:'bestNote',isBest:true}));
      scen.push(Object.assign(scenarioFor(ship,swDir,rows),{nameKey:'bowSwell',noteKey:'first48'}));
      const wd=meanDir(first.map(r=>r.wind10_dir_deg),first.map(r=>r.wind10_kt)); scen.push(Object.assign(scenarioFor(ship,wd,rows),{nameKey:'bowWind',noteKey:'first48'}));
    }
    // default step for the polar/animation: the roughest forecast step, judged on the whole heading envelope (independent of any heading choice)
    let step=0, worstEnv=-1; rows.forEach((_,i)=>{ const env=Math.max(...sweep.map(sc=>sc.steps[i].res.rt.sig)); if(env>worstEnv){ worstEnv=env; step=i; } });
    RESULTS={ship,scen,sweep,rows,step,missing:Math.round((rows[rows.length-1].valid-rows[0].valid)/3600e3/6+1-rows.length)}; SEL=0;
    renderSummary(); renderDetail();
  }
  function renderSummary(){
    const {scen,rows,missing}=RESULTS; const hsMax=Math.max(...rows.map(r=>r.hs_total));
    setStatus($('runStatus'),`${t('stSteps')(rows.length,missing)} · ${FC.issued?t('stIssued')+' '+fmtDT(FC.issued):''} · ${$('cond').options[$('cond').selectedIndex].text}`);
    $('meta').innerHTML=`<div><b>${FC.issued?fmtDT(FC.issued):'—'}</b><span>${t('issued')}</span></div><div><b>${FC.position?FC.position.text:'—'}</b><span>${t('position')}</span></div><div><b>${fmtDate(rows[0].valid)} → ${fmtDate(rows[rows.length-1].valid)}</b><span>${t('valid')}</span></div><div><b>${hsMax.toFixed(1)} m</b><span>${t('maxHs')}</span></div>`;
    // helideck strip
    const n=rows.length; const cols=`repeat(${n},minmax(0,1fr))`;
    let days=''; let last=''; const spans=[]; rows.forEach((r,i)=>{ const d=r.valid.toLocaleDateString(t('locale'),{weekday:'short',day:'2-digit'}); if(d!==last){ spans.push({d,start:i,len:1}); last=d; } else spans[spans.length-1].len++; });
    days=`<div class="r"><div class="n"></div><div class="days" style="grid-template-columns:${cols}">${spans.map(s=>`<div style="grid-column:span ${s.len}">${s.d}</div>`).join('')}</div></div>`;
    const strip=scen.map(s=>['AW139','S92'].map(ac=>`<div class="r"><div class="n">${t(s.nameKey)} ${pad3(s.heading)}°<small>${PBS.CAL.hms.aircraft[ac].label}</small></div><div class="cells" style="grid-template-columns:${cols}">${s.steps.map(st=>{ const p=st.res.heli.aircraft[ac].Pgreen; return `<div class="c${st.night?' night':''}" style="background:${pcol(p)}" title="${fmtDT(st.row.valid)}${st.night?' (night)':''} · P(green) ${(p*100).toFixed(0)} %">${(p*100).toFixed(0)}%</div>`; }).join('')}</div></div>`).join('')).join('');
    if(HELI_ENABLED){ $('heliStrip').innerHTML=`<div class="strip">${days}${strip}</div>`; } else { $('heliStrip').innerHTML=''; $('heliSoon').hidden=false; $('heliLeg').hidden=true; $('heliNote').hidden=true; $('heli').classList.add('soon'); }
    $('cards').innerHTML=scen.map((s,i)=>{ const w=s.steps[s.worst]; const r=w.res; return `<div class="card${i===SEL?' sel':''}${s.isBest?' isbest':''}" data-i="${i}" tabindex="0" role="button">${s.isBest?'<div class="best">'+t('best')+'</div>':''}<div class="tag"><span>${t(s.nameKey)}</span><span>${t(s.noteKey)}</span></div><div class="hd">${pad3(s.heading)}°</div><div class="nm">${t('worstStep')}: ${fmtDT(w.row.valid)} · Hs ${w.row.hs_total.toFixed(1)} m</div><div class="stats"><div>${t('heavePP')}<b class="${cls(r.heave.sig,REF.heave)}">${r.heave.sig.toFixed(2)} m</b></div><div>${t('drillFloor')}<b class="${cls(r.rt.sig,REF.heave)}">${r.rt.sig.toFixed(2)} m</b></div><div>${t('pitch')}<b class="${cls(r.pitch.sig,REF.pitch)}">${r.pitch.sig.toFixed(2)}°</b></div><div>${t('roll')}<b class="${cls(r.roll.sig,REF.roll)}">${r.roll.sig.toFixed(2)}°</b></div></div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><span class="pill ${cls(s.maxIdx,1)}">${t('index')} ${s.maxIdx.toFixed(2)}</span>${HELI_ENABLED?`<span class="pill ${pcls(s.heliMin.AW139)}">${t('heliMin')} AW139 ${(s.heliMin.AW139*100).toFixed(0)} %</span><span class="pill ${pcls(s.heliMin.S92)}">S-92 ${(s.heliMin.S92*100).toFixed(0)} %</span>`:''}</div></div>`; }).join('');
    $('cards').querySelectorAll('.card').forEach(c=>{ const go=()=>{ SEL=+c.dataset.i; renderSummary(); renderDetail(); }; c.addEventListener('click',go); c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }); });
    $('summary').hidden=false;
  }
  function renderDetail(){
    const {scen,sweep,rows}=RESULTS; const s=scen[SEL];
    $('detailTitle').textContent=`${t('s3')} ${t(s.nameKey)} — ${pad3(s.heading)}°`;
    let html=`<tr><th class="l" rowspan="2">${t('thTime')}</th><th rowspan="2">${t('thHs')}</th><th rowspan="2">${t('thWind')}</th><th rowspan="2">${t('thSwell')}</th><th rowspan="2">${t('thRel')}</th><th class="grp" colspan="9">${t('grpMotion')}</th>${HELI_LIGHT?`<th class="grp">${t('grpHeli')}</th>`:''}</tr>`+
      `<tr><th>${t('thHeaveSig')}</th><th>${t('thHeaveMax')}</th><th>${t('thRtSig')}</th><th>${t('thRtMax')}</th><th>${t('thPitchSig')}</th><th>${t('thPitchMax')}</th><th>${t('thRollSig')}</th><th>${t('thRollMax')}</th><th>${t('thTz')}</th>${HELI_LIGHT?`<th>${PBS.CAL.hms.aircraft[AC].label.split(' ')[0]} · ${t('thLikely')}</th>`:''}</tr>`;
    let lastDay='';
    s.steps.forEach(st=>{ const r=st.row,res=st.res,H=res.heli; const d=fmtDate(r.valid); if(d!==lastDay){ html+=`<tr class="day"><td colspan="${HELI_LIGHT?15:14}">${d}</td></tr>`; lastDay=d; }
      const ds=dominantSwell(r); const rel=180-Math.abs(((ds.d-s.heading+180)%360+360)%360-180);
      html+=`<tr><td class="l">${fmtTime(r.valid)}${st.night&&HELI_LIGHT&&HELI_NIGHT_LIMITS?' <span class="moon" title="'+t('nightLbl')+'">☾</span>':''}</td><td>${r.hs_total.toFixed(1)} m</td><td>${r.wind10_dir} ${r.wind10_kt} kt</td><td>${ds.n} ${ds.hs.toFixed(1)} m / ${ds.tp} s</td><td>${Math.round(rel)}°</td>`+
        `<td class="v ${cls(res.heave.sig,REF.heave)}">${res.heave.sig.toFixed(2)} m</td><td>${res.heave.max.toFixed(2)} m</td><td class="v ${cls(res.rt.sig,REF.heave)}">${res.rt.sig.toFixed(2)} m</td><td>${res.rt.max.toFixed(2)} m</td>`+
        `<td class="v ${cls(res.pitch.sig,REF.pitch)}">${res.pitch.sig.toFixed(2)}°</td><td>${res.pitch.max.toFixed(2)}°</td><td class="v ${cls(res.roll.sig,REF.roll)}">${res.roll.sig.toFixed(2)}°</td><td>${res.roll.max.toFixed(2)}°</td><td>${isFinite(res.heave.Tz)?res.heave.Tz.toFixed(1)+' s':'—'}</td>`+
        (HELI_LIGHT?(()=>{ const pg=H.aircraft[AC].Pgreen; const g=pg>=0.5; return `<td class="${g?'pg':'pr'}">${g?t('green'):t('red')} ${((g?pg:1-pg)*100).toFixed(0)} %</td>`; })():'')+`</tr>`; });
    $('tbl').innerHTML=html;
    $('chartTS').innerHTML=tsChart(scen,rows);
    $('legendTS').innerHTML=scen.map((sc,i)=>`<span><i style="background:${SERIES[i]}"></i>${t(sc.nameKey)} ${pad3(sc.heading)}°</span>`).join('');
    // polar and animation follow one forecast step chosen with the slider; they never depend on the selected heading card
    $('animStep').max=rows.length-1; $('animStep').value=RESULTS.step; renderStep(); startAnim();
    $('detail').hidden=false;
  }
  function renderStep(){
    const {scen,sweep,rows}=RESULTS; const wi=RESULTS.step; const r=rows[wi];
    const vals=sweep.map(sc=>({h:sc.heading,v:sc.steps[wi].res.rt.sig}));
    $('chartPolar').innerHTML=polarChart(vals,scen,r);
    $('polarNote').textContent=t('polarNote')(fmtDT(r.valid));
    setAnim(wi);
  }
  // ---- animation ----
  const ANIM={raf:null,t0:0,playing:true,step:0,sig:null,parts:null};
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mkSignal(amp,Tz,seed){ // irregular motion: three components around Tz, std ≈ amp/2 (amp = significant single amplitude)
    const w=2*Math.PI/Math.max(Tz,4); const comps=[[0.55,0.82],[0.65,1.0],[0.45,1.27]];
    return t=>comps.reduce((a,[k,f],i)=>a+amp*k*Math.sin(w*f*t+seed*(i+1)*2.1),0);
  }
  function setAnim(step){
    const s=RESULTS.scen[SEL]; const st=s.steps[Math.max(0,Math.min(step,s.steps.length-1))]; const r=st.res; ANIM.step=step;
    const Gh=22, Ga=8;  // visual gains: 1 m of heave -> 22 px, angles x8
    ANIM.sig={ heave:mkSignal(r.heave.sig/2*Gh, r.heave.Tz, 0.3), pitch:mkSignal(r.pitch.sig*Ga, r.pitch.Tz, 1.1), roll:mkSignal(r.roll.sig*Ga, r.roll.Tz, 2.3), Gh, Ga,
      wave:Math.min(28,(st.row.hs_total/2)*7), waveT:r.heave.Tz>0?r.heave.Tz:9 };
    $('animNote').textContent=t('animNote')(fmtDT(st.row.valid),pad3(s.heading),r)+(HELI_LIGHT?' '+t('heliLightNote'):'');
    if(HELI_LIGHT){ const pg=r.heli.aircraft[AC].Pgreen, g=pg>=0.5, col=g?'#78D64B':'#DA291C';
      $('hlDot').setAttribute('fill',col); $('hlGlow').setAttribute('fill',col); $('hlBox').style.stroke=col;
      $('hlT1').textContent=`HMS · ${PBS.CAL.hms.aircraft[AC].label.split(' ')[0]} · ${HELI_NIGHT_LIMITS?(st.night?t('nightLbl'):t('dayLbl')):'NORMAM-27'}`;
      $('hlT2').textContent=`${g?t('likelyGreen'):t('likelyRed')} ${((g?pg:1-pg)*100).toFixed(0)} %`; $('hlT2').style.fill=g?'#B6EE9A':'#FFB3AC';
      const w=Math.ceil(Math.max($('hlT1').textContent.length*5.0,$('hlT2').textContent.length*7.5))+16; $('hlBox').setAttribute('width',w);
      $('hlCall').setAttribute('transform',`translate(${Math.min(20,190-w)} -52)`); }
    $('heliLight').style.display=HELI_LIGHT?'':'none'; $('acRow').style.display=HELI_LIGHT?'':'none';
    $('animLbl').textContent=`${fmtDT(st.row.valid)} · Hs ${st.row.hs_total.toFixed(1)} m · HDG ${pad3(s.heading)}°`;
    if(reduced||!ANIM.playing) drawAnim(1.5);
  }
  function drawAnim(tt){
    const g=ANIM.sig; if(!g) return;
    const h=g.heave(tt), p=g.pitch(tt), ro=g.roll(tt);
    const cx=250, cy=232;   // centre of gravity on the sprite (3/4 aerial view, bow lower right)
    $('animShip').setAttribute('transform',`translate(0,${(-h).toFixed(2)}) translate(${cx} ${cy}) rotate(${(-p*0.9).toFixed(3)}) skewX(${(ro*0.9).toFixed(3)}) translate(${-cx} ${-cy})`);
    // real (un-exaggerated) values for the read-out; well centre 7 m forward of CG
    const hm=h/g.Gh, pd=p/g.Ga, rd=ro/g.Ga, rt=hm-7*Math.sin(pd*Math.PI/180);
    const L=$('animRTline'); L.setAttribute('y2',(26-rt*16).toFixed(1));
    const k=2*Math.PI/140, ph=2*Math.PI*tt/g.waveT; let d='M0 400 L0 286 ', f='M0 286 ';
    for(let x=0;x<=560;x+=10){ const yy=286+g.wave*Math.sin(k*x-ph)+0.35*g.wave*Math.sin(2.3*k*x+0.7*ph); d+=`L${x} ${yy.toFixed(1)} `; f+=`L${x} ${(yy-3).toFixed(1)} `; }
    $('animSea').setAttribute('d',d+'L560 400 Z'); $('animFoam').setAttribute('d',f);
    let db='M0 400 L0 210 '; for(let x=0;x<=560;x+=14) db+=`L${x} ${(210+0.5*g.wave*Math.sin(k*0.7*x+0.6*ph)).toFixed(1)} `; $('animSeaBack').setAttribute('d',db+'L560 400 Z');
    $('hudH').textContent=(hm>=0?'+':'')+hm.toFixed(2)+' m'; $('hudRT').textContent=(rt>=0?'+':'')+rt.toFixed(2)+' m';
    $('hudP').textContent=(pd>=0?'+':'')+pd.toFixed(2)+'°'; $('hudR').textContent=(rd>=0?'+':'')+rd.toFixed(2)+'°';
  }
  function animLoop(ts){ if(!ANIM.t0) ANIM.t0=ts; const tt=(ts-ANIM.t0)/1000*3; if(ANIM.playing&&ANIM.sig) drawAnim(tt); ANIM.raf=requestAnimationFrame(animLoop); }
  function startAnim(){ if(reduced){ ANIM.playing=false; $('animPlay').hidden=true; drawAnim(1.5); return; } if(!ANIM.raf) ANIM.raf=requestAnimationFrame(animLoop); }
  $('animStep').addEventListener('input',e=>{ RESULTS.step=+e.target.value; renderStep(); });
  $('acSel').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ AC=b.dataset.ac; $('acSel').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); if(RESULTS){ renderDetail(); } }));
  $('animPlay').addEventListener('click',()=>{ ANIM.playing=!ANIM.playing; $('animPlay').textContent=ANIM.playing?t('animPause'):t('animPlayLbl'); });
  function tsChart(scen,rows){
    const W=1100,H=330,ml=44,mr=12,mt=10,mb=28, panels=[{k:'heave',t:t('chHeave'),ref:REF.heave},{k:'pitch',t:t('chPitch'),ref:REF.pitch},{k:'roll',t:t('chRoll'),ref:REF.roll}];
    const ph=(H-mt-mb)/3, n=rows.length, x=i=>ml+(W-ml-mr)*i/(n-1);
    let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;height:auto;display:block" role="img" aria-label="Significant motions over the forecast for each heading scenario">`;
    panels.forEach((p,pi)=>{ const y0=mt+pi*ph, y1=y0+ph-8; let vmax=p.ref*1.05; scen.forEach(s=>s.steps.forEach(st=>{ vmax=Math.max(vmax,st.res[p.k].sig*1.1); }));
      const y=v=>y1-(y1-y0-12)*v/vmax;
      [0,vmax/2,vmax].forEach(tk=>{ g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--grid)" stroke-width="1"/><text x="${ml-4}" y="${y(tk)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${tk.toFixed(1)}</text>`; });
      g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(p.ref)}" y2="${y(p.ref)}" stroke="var(--yellow)" stroke-dasharray="4 3" stroke-width="1.2"/>`;
      g+=`<text x="${ml+4}" y="${y0+10}" font-size="11" font-weight="600" fill="var(--muted)">${p.t}</text>`;
      scen.forEach((s,si)=>{ const d=s.steps.map((st,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(st.res[p.k].sig).toFixed(1)}`).join(''); g+=`<path d="${d}" fill="none" stroke="${SERIES[si]}" stroke-width="${si===SEL?2.6:1.6}" opacity="${si===SEL?1:0.75}"/>`; });
    });
    let lastDay=''; rows.forEach((r,i)=>{ const d=r.valid.toLocaleDateString(t('locale'),{weekday:'short',day:'2-digit'}); if((d!==lastDay&&r.valid.getHours()===0)||i===0){ lastDay=d; g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${mt}" y2="${H-mb}" stroke="var(--grid)"/><text x="${x(i)+2}" y="${H-mb+14}" font-size="10" fill="var(--muted)">${d}</text>`; } });
    return g+'</svg>';
  }
  function polarChart(vals,scen,row){
    const S=300,c=S/2,R=112; const vmax=Math.max(REF.heave,...vals.map(v=>v.v))*1.05;
    let g=`<svg viewBox="0 0 ${S} ${S}" width="100%" style="max-width:440px;height:auto;display:block;margin:0 auto" role="img" aria-label="Drill floor vertical motion versus heading">`;
    [0.25,0.5,0.75,1].forEach(f=>{ g+=`<circle cx="${c}" cy="${c}" r="${R*f}" fill="none" stroke="var(--grid)"/><text x="${c+3}" y="${c-R*f+10}" font-size="9" fill="var(--muted)">${(vmax*f).toFixed(1)}</text>`; });
    g+=`<circle cx="${c}" cy="${c}" r="${R*REF.heave/vmax}" fill="none" stroke="var(--yellow)" stroke-dasharray="4 3"/>`;
    ['N','E','S','W'].forEach((l,i)=>{ const a=i*90*Math.PI/180; g+=`<text x="${c+(R+14)*Math.sin(a)}" y="${c-(R+14)*Math.cos(a)+4}" font-size="11" text-anchor="middle" font-weight="600">${l}</text>`; });
    const pt=v=>{ const a=v.h*Math.PI/180, r=R*v.v/vmax; return [c+r*Math.sin(a),c-r*Math.cos(a)]; };
    g+=`<path d="${vals.map((v,i)=>{ const [x,y]=pt(v); return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1); }).join('')}Z" fill="var(--s1)" fill-opacity="0.18" stroke="var(--s1)" stroke-width="2"/>`;
    const arrows=[{n:'W',d:row.wind10_dir_deg,ok:row.wind10_kt>0},{n:'S1',d:row.swell1_dir_deg,ok:row.swell1_hs>0},{n:'S2',d:row.swell2_dir_deg,ok:row.swell2_hs>0}];
    arrows.forEach(a=>{ if(a.d==null||!a.ok) return; const th=a.d*Math.PI/180; const x1=c+(R+2)*Math.sin(th),y1=c-(R+2)*Math.cos(th),x2=c+(R-18)*Math.sin(th),y2=c-(R-18)*Math.cos(th); g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--slate)" stroke-width="2"/><text x="${c+(R+26)*Math.sin(th)}" y="${c-(R+26)*Math.cos(th)+4}" font-size="10" text-anchor="middle" fill="var(--muted)">${a.n}</text>`; });
    scen.forEach((s,i)=>{ const v=vals.find(x=>x.h===s.heading)||vals.reduce((m,x)=>Math.abs(x.h-s.heading)<Math.abs(m.h-s.heading)?x:m); const [x,y]=pt(v); g+=`<circle cx="${x}" cy="${y}" r="5" fill="${SERIES[i]}" stroke="var(--panel)" stroke-width="1.5"/>`; });
    return g+'</svg>';
  }
  applyLang();
  run();
})();
</script>
